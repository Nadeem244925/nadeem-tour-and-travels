  <!-- Wordmark -->
  <text x="126" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="3.5" fill="#0a1526">NADEEM TOUR</text>
  <text x="127" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="8.5" fill="#a88638">&amp; TRAVELS</text>
  <text x="127" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic" letter-spacing="2.2" fill="#7a8ba0">Your Journey. Our Expertise.</text>
