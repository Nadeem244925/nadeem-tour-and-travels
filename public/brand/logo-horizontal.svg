    <circle cx="60" cy="60" r="37" fill="none" stroke="#d9ba68" stroke-width="1.1" opacity="0.55"/>
    <ellipse cx="60" cy="60" rx="5" ry="29" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.65"/>
    <ellipse cx="60" cy="60" rx="24.5" ry="3.2" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.55"/>
    <g transform="translate(74 45) rotate(52)" fill="url(#gold)">
