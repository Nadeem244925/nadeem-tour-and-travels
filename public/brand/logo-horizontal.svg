<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-labelledby="t d">
  <title id="t">Nadeem Tour &amp; Travels — Your Journey. Our Expertise.</title>
  <desc id="d">Emblem with the Nadeem Tour &amp; Travels wordmark and tagline.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e0b0"/>
      <stop offset="0.5" stop-color="#d9ba68"/>
      <stop offset="1" stop-color="#b8933f"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g>
