<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t d">
  <title id="t">Nadeem Tour &amp; Travels</title>
  <desc id="d">Gold globe emblem with an ascending aircraft.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e0b0"/>
      <stop offset="0.5" stop-color="#d9ba68"/>
      <stop offset="1" stop-color="#b8933f"/>
    </linearGradient>
  </defs>

  <!-- Outer & inner guide rings -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#d9ba68" stroke-width="1.2" opacity="0.55"/>

  <!-- Globe meridians -->
  <ellipse cx="60" cy="60" rx="5.5" ry="32" fill="none" stroke="url(#gold)" stroke-width="1.7" opacity="0.6"/>
  <ellipse cx="60" cy="60" rx="27" ry="3.6" fill="none" stroke="url(#gold)" stroke-width="1.7" opacity="0.5"/>

  <!-- Aircraft (nose up, rotated to fly north-east) -->
  <g transform="translate(74 46) rotate(52)" fill="url(#gold)">
    <path d="M0 -12 L5 1 L16.5 5 L7.2 8.6 L4.8 14.5 L2.1 9.2 L0 10.6 L-2.1 9.2 L-4.8 14.5 L-7.2 8.6 L-16.5 5 L-5 1 Z"/>
  </g>

  <!-- Route markers -->
  <circle cx="27" cy="85" r="3" fill="#e6cf8c"/>
  <circle cx="93" cy="76" r="2" fill="#e6cf8c" opacity="0.75"/>
</svg>
